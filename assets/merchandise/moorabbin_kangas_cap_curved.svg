<svg width="100%" viewBox="0 0 1010 370" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Moorabbin Kangas curved cap wordmark</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A gently arched two-line wordmark for a baseball cap: MOORABBIN arched on top in bold white over KANGAS arched below in heavy white italic, shown on a royal blue cap colour, transparent in the file.</desc>
<defs>
<path id="arcMcap" d="M 220 120 Q 500 86 780 120" fill="none"/>
<path id="arcKcap" d="M 150 300 Q 500 258 850 300" fill="none"/>
</defs>

<rect x="0" y="0" width="1000" height="360" rx="20" fill="#013087" style="fill:rgb(1, 48, 135);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text font-size="46" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Archivo, Arial, sans-serif;font-size:46px;font-weight:700;text-anchor:middle;dominant-baseline:auto"><textPath xlink:href="#arcMcap" startOffset="50%" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Archivo, Arial, sans-serif;font-size:46px;font-weight:700;text-anchor:middle;dominant-baseline:auto">MOORABBIN</textPath></text>
<text font-size="120" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Archivo, &quot;Arial Black&quot;, sans-serif;font-size:120px;font-weight:900;font-style:italic;text-anchor:middle;dominant-baseline:auto"><textPath xlink:href="#arcKcap" startOffset="50%" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Archivo, &quot;Arial Black&quot;, sans-serif;font-size:120px;font-weight:900;font-style:italic;text-anchor:middle;dominant-baseline:auto">KANGAS</textPath></text>
</svg>