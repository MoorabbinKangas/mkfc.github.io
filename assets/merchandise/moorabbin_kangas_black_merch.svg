<text x="500" y="189" text-anchor="middle" font-size="57" textLength="820" lengthAdjust="spacing" transform="matrix(1 0 0 1.2 0 -33.7)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Archivo, Arial, sans-serif;font-size:57px;font-weight:700;text-anchor:middle;dominant-baseline:auto">MOORABBIN</text>
<text x="500" y="352" text-anchor="middle" font-size="171" textLength="820" lengthAdjust="spacing" vector-effect="non-scaling-stroke" transform="matrix(1 0 0 1.2 0 -58.1)" style="fill:none;stroke:rgb(0, 0, 0);color:rgb(0, 0, 0);stroke-width:7px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:Archivo, &quot;Arial Black&quot;, sans-serif;font-size:171px;font-weight:900;font-style:italic;text-anchor:middle;dominant-baseline:auto">KANGAS</text>
