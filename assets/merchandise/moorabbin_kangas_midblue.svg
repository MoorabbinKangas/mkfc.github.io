<svg width="100%" viewBox="0 0 1010 510" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Moorabbin Kangas wordmark on mid blue background</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A mid blue rectangle in 2:1 proportion with MOORABBIN on top in bold white widely spaced lettering and KANGAS below in bold italic white outlines three times the height, both lines stretched taller, both the same width.</desc>

<rect x="0" y="0" width="1000" height="500" rx="20" fill="#1F4DA8" style="fill:rgb(31, 77, 168);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect x="40" y="40" width="920" height="420" rx="10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(0, 0, 0);stroke-width:3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="500" y="189" text-anchor="middle" font-size="57" textLength="820" lengthAdjust="spacing" transform="matrix(1 0 0 1.2 0 -33.7)" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Archivo, Arial, sans-serif;font-size:57px;font-weight:700;text-anchor:middle;dominant-baseline:auto">MOORABBIN</text>
<text x="500" y="352" text-anchor="middle" font-size="171" textLength="820" lengthAdjust="spacing" vector-effect="non-scaling-stroke" transform="matrix(1 0 0 1.2 0 -58.1)" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(0, 0, 0);stroke-width:7px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:Archivo, &quot;Arial Black&quot;, sans-serif;font-size:171px;font-weight:900;font-style:italic;text-anchor:middle;dominant-baseline:auto">KANGAS</text>
</svg>