<svg xmlns="http://www.w3.org/2000/svg" width="10cm" height="5cm" viewBox="0 0 1000 500" role="img">
<title>Moorabbin Kangas black split wordmark, no border, 10cm by 5cm</title>
<desc>Transparent background, 2:1 proportion. Bold black MOORABBIN over KANGAS that is solid black on the top half and black outline on the bottom half, with no border and text widened toward the vertical edges.</desc>
<defs>
<clipPath id="kTop"><rect x="0" y="0" width="1000" height="290.5"/></clipPath>
</defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;1,900&amp;display=swap');
.m{font-family:'Archivo','Arial',sans-serif;font-weight:700;fill:#000000;}
.kfill{font-family:'Archivo','Arial Black',sans-serif;font-weight:900;font-style:italic;fill:#000000;}
.kline{font-family:'Archivo','Arial Black',sans-serif;font-weight:900;font-style:italic;fill:none;stroke:#000000;stroke-width:7;stroke-linejoin:round;}
</style>
<text class="m" x="500" y="189" text-anchor="middle" font-size="71.25" textLength="920" lengthAdjust="spacing" transform="matrix(1 0 0 1.2 0 -33.7)">MOORABBIN</text>
<g transform="matrix(1 0 0 1.2 0 -58.1)">
<text class="kfill" x="500" y="352" text-anchor="middle" font-size="171" textLength="920" lengthAdjust="spacing" clip-path="url(#kTop)">KANGAS</text>
<text class="kline" x="500" y="352" text-anchor="middle" font-size="171" textLength="920" lengthAdjust="spacing" vector-effect="non-scaling-stroke">KANGAS</text>
</g>
</svg>
