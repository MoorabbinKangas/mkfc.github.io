<svg xmlns="http://www.w3.org/2000/svg" width="10cm" height="5cm" viewBox="0 0 1000 500" role="img">
<title>Moorabbin Kangas black split wordmark, no border, larger type, 10cm by 5cm</title>
<desc>Transparent background, 2:1 proportion. MOORABBIN enlarged 40 percent in bold black over KANGAS enlarged 25 percent in bold italic, solid black on the top half and black outline on the bottom half, no border, width held constant.</desc>
<defs>
<clipPath id="kTop"><rect x="0" y="0" width="1000" height="320.5"/></clipPath>
</defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;1,900&amp;display=swap');
.m{font-family:'Archivo','Arial',sans-serif;font-weight:700;fill:#000000;}
.kfill{font-family:'Archivo','Arial Black',sans-serif;font-weight:900;font-style:italic;fill:#000000;}
.kline{font-family:'Archivo','Arial Black',sans-serif;font-weight:900;font-style:italic;fill:none;stroke:#000000;stroke-width:7;stroke-linejoin:round;}
</style>
<text class="m" x="500" y="188.75" text-anchor="middle" font-size="99.75" textLength="920" lengthAdjust="spacing" transform="matrix(1 0 0 1.2 0 -37.75)">MOORABBIN</text>
<g transform="matrix(1 0 0 1.2 0 -79.49)">
<text class="kfill" x="500" y="397.45" text-anchor="middle" font-size="213.75" textLength="920" lengthAdjust="spacingAndGlyphs" clip-path="url(#kTop)">KANGAS</text>
<text class="kline" x="500" y="397.45" text-anchor="middle" font-size="213.75" textLength="920" lengthAdjust="spacingAndGlyphs" vector-effect="non-scaling-stroke">KANGAS</text>
</g>
</svg>
